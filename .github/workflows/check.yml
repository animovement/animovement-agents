# The repository root is a plugin twice over: plugin.json for Open Plugins consumers and
# .claude-plugin/plugin.json for Claude Code. Two manifests over the skills is the only
# duplication this layout cannot avoid, so assert they stay in agreement, and that a change
# to the skills bumps the version they carry.
name: Check packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check.sh compares skills/ and the version against origin/main, which a
          # shallow checkout does not have.
          fetch-depth: 0
      - run: ./scripts/check.sh
